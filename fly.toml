# fly.toml app configuration file generated for promptsbot on 2023-12-14T17:00:43-06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "promptsbot"
primary_region = "ord"
kill_signal = "SIGTERM"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[services]]
  protocol = "tcp"
  internal_port = 8080
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
